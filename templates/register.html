<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - Road Damage Detection</title>

  <!-- FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

  <!-- BOOTSTRAP -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- PARTICLES -->
  <script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>

  <style>

    body {
      background:#020617;
      color:white;
      font-family:'Inter',sans-serif;
      min-height:100vh;
      overflow:hidden;
    }

    #particles-js{
      position:fixed;
      width:100%;
      height:100%;
      z-index:-1;
    }

    /* NAVBAR */
    .navbar{
      background:rgba(255,255,255,0.05) !important;
      backdrop-filter:blur(14px);
      border-bottom:1px solid rgba(255,255,255,0.08);
    }

    .navbar-brand{
      color:#facc15 !important;
      font-weight:800;
    }

    .nav-link{
      color:#ccc !important;
    }

    .nav-link:hover{
      color:#fff !important;
    }

    /* CARD */
    .card{
      border-radius:20px;
      background:rgba(255,255,255,0.05);
      backdrop-filter:blur(18px);
      border:1px solid rgba(255,255,255,0.1);
      transition:.4s;
    }

    .card:hover{
      transform:translateY(-6px);
      box-shadow:0 0 40px rgba(250,204,21,.25);
    }

    h2{
      font-weight:800;
      color:#facc15;
    }

    /* INPUT */
    .form-control{
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.1);
      color:#f9fafb;
      border-radius:12px;
    }

    .form-control:focus{
      background:rgba(255,255,255,0.08);
      border-color:#facc15;
      box-shadow:0 0 10px rgba(250,204,21,.3);
      color:white;
    }

    /* FIX LABEL VISIBILITY */
    label, .form-label {
      color: #e5e7eb !important;
      font-weight: 500;
    }

    /* PLACEHOLDER */
    ::placeholder {
      color: #9ca3af !important;
      opacity: 1;
    }

    /* BUTTON */
    .btn-warning{
      background:linear-gradient(135deg,#facc15,#fde047);
      border:none;
      color:black;
      font-weight:600;
      border-radius:12px;
      transition:.3s;
    }

    .btn-warning:hover{
      transform:translateY(-3px);
      box-shadow:0 0 25px rgba(250,204,21,.5);
    }

    .btn-outline-light{
      border-radius:12px;
    }

    .btn-danger{
      border-radius:12px;
    }

    a{
      text-decoration:none;
    }

    /* FIX TEXT VISIBILITY */
    p {
      color: #d1d5db;
    }

    .text-warning {
      color: #facc15 !important;
    }

    .container{
      margin-top:40px;
    }

  </style>
</head>

<body>

<!-- PARTICLES -->
<div id="particles-js"></div>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{{ url_for('home') }}">🚧 Road Damage Detection</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('home') }}">Home</a></li>
    
      </ul>
    </div>
  </div>
</nav>

<!-- REGISTER FORM -->
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6">

      <div class="card p-4">

        <h2 class="text-center mb-4">Create an Account</h2>

        <form method="POST" action="{{ url_for('register') }}">

          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" placeholder="Enter username" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" placeholder="Enter password" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <input type="password" name="confirm_password" class="form-control" placeholder="Confirm password" required>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-warning">Register</button>
          </div>

        </form>

        <p class="mt-3 text-center">
          Already have an account?
          <a href="{{ url_for('login') }}" class="text-warning fw-bold">Login here</a>
        </p>

      </div>

    </div>
  </div>
</div>

<!-- PARTICLES -->
<script>
tsParticles.load("particles-js",{
particles:{
number:{value:80},
color:{value:"#facc15"},
links:{enable:true,color:"#facc15",opacity:0.2},
move:{enable:true,speed:1},
size:{value:2},
opacity:{value:0.6}
},
interactivity:{
events:{onHover:{enable:true,mode:"repulse"}},
modes:{repulse:{distance:120}}
}
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
