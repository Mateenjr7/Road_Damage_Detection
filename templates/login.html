<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Road Damage Detection</title>

  <!-- FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

  <!-- BOOTSTRAP -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

  <!-- PARTICLES -->
  <script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>

  <style>

    body{
      background:#020617;
      color:white;
      font-family:'Inter',sans-serif;
      overflow:hidden;
    }

    #particles-js{
      position:fixed;
      width:100%;
      height:100%;
      z-index:-1;
    }

    /* NAVBAR */
    .navbar{
      background:rgba(255,255,255,0.05);
      backdrop-filter:blur(14px);
      border-bottom:1px solid rgba(255,255,255,0.08);
    }

    .navbar-brand{
      color:#facc15 !important;
      font-weight:800;
    }

    /* CARD */
    .card-road{
      background:rgba(255,255,255,0.05);
      backdrop-filter:blur(18px);
      border-radius:20px;
      border:1px solid rgba(255,255,255,0.1);
      transition:.4s;
    }

    .card-road:hover{
      transform:translateY(-6px);
      box-shadow:0 0 40px rgba(250,204,21,.25);
    }

    /* INPUT */
    .form-control{
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.1);
      color:white;
      border-radius:12px;
    }

    .form-control:focus{
      background:rgba(255,255,255,0.08);
      border-color:#facc15;
      box-shadow:0 0 10px rgba(250,204,21,.3);
      color:white;
    }

    /* BUTTON */
    .btn-warning{
      background:linear-gradient(135deg,#facc15,#fde047);
      border:none;
      color:black;
      font-weight:600;
      border-radius:12px;
      transition:.3s;
    }

    .btn-warning:hover{
      transform:translateY(-3px);
      box-shadow:0 0 25px rgba(250,204,21,.5);
    }

    /* PASSWORD TOGGLE */
    .toggle-password{
      position:absolute;
      right:15px;
      top:38px;
      cursor:pointer;
      color:#ccc;
    }

    /* CENTER */
    .container{
      height:90vh;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    a{
      text-decoration:none;
    }

  </style>
</head>

<body>

<!-- PARTICLES -->
<div id="particles-js"></div>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="{{ url_for('home') }}">🚧 Road Damage Detection</a>
  </div>
</nav>

<!-- Login -->
<div class="container">
  <div class="col-md-4 mx-auto card-road p-4 shadow">

    <h3 class="text-center mb-4">🔑 Login</h3>

    <form method="POST">

      <div class="mb-3">
        <label>Username</label>
        <input type="text" class="form-control" name="username" required>
      </div>

      <div class="mb-3 position-relative">
        <label>Password</label>
        <input type="password" class="form-control" id="password" name="password" required>
        <span class="toggle-password" onclick="togglePassword()">👁</span>
      </div>

      <!-- Remember + Forgot -->
      <div class="d-flex justify-content-between mb-3">
        <div>
          <input type="checkbox" id="remember">
          <label for="remember" class="small"> Remember me</label>
        </div>
        <a href="#" class="small text-warning">Forgot Password?</a>
      </div>

      <button type="submit" class="btn btn-warning w-100 mt-2">Login</button>

    </form>

    <p class="text-center mt-3">
      Don’t have an account?
      <a href="{{ url_for('register') }}" class="text-warning">Register</a>
    </p>

  </div>
</div>

<!-- PASSWORD SCRIPT -->
<script>
function togglePassword(){
  const pass=document.getElementById("password");
  pass.type = pass.type === "password" ? "text" : "password";
}
</script>

<!-- PARTICLES CONFIG -->
<script>
tsParticles.load("particles-js",{
particles:{
number:{value:80},
color:{value:"#facc15"},
links:{enable:true,color:"#facc15",opacity:0.2},
move:{enable:true,speed:1},
size:{value:2},
opacity:{value:0.6}
},
interactivity:{
events:{onHover:{enable:true,mode:"repulse"}},
modes:{repulse:{distance:120}}
}
});
</script>

</body>
</html>
