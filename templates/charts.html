<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Charts - Road Damage Detection</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

<style>

/* ================= GLOBAL ================= */
body{
  background:#020617; /* YOUR THEME */
  color:white;
  font-family:'Inter',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
}

/* ===== TOPOGRAPHY CANVAS ===== */
#topoCanvas{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:-2;
}

/* ===== GRID ===== */
body::before{
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background-image:
    linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
  background-size:40px 40px;
  z-index:-1;
}

/* ================= NAVBAR ================= */
.navbar{
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(14px);
}

.navbar-brand{
  color:#facc15 !important;
  font-weight:800;
}

/* ================= TITLE ================= */
h2{
  color:#facc15;
  font-weight:800;
  margin-bottom:30px;
}

/* ================= CARDS ================= */
.glass{
  background: rgba(255,255,255,0.05);
  backdrop-filter:blur(16px);
  border-radius: 15px;
  padding: 25px;
  transition:.3s;
}

.glass:hover{
  transform: translateY(-8px) scale(1.02);
  box-shadow: 0px 12px 40px rgba(250,204,21,0.3);
}

/* ================= METRICS ================= */
.metric{
  font-size:2rem;
  font-weight:800;
  color:#facc15;
}

.chart-box{
  margin-top:30px;
}

</style>
</head>

<body>

<canvas id="topoCanvas"></canvas>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{{ url_for('home') }}">🚧 Road Damage Detection</a>

    <ul class="navbar-nav ms-auto">
      <li class="nav-item"><a class="nav-link" href="{{ url_for('home') }}">Home</a></li>
      <li class="nav-item">
        <a class="nav-link text-white" href="{{ url_for('about') }}">About</a>
      </li>
      <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Detection</a></li>
      <li class="nav-item"><a class="nav-link active" href="{{ url_for('charts') }}">Charts</a></li>
      <li class="nav-item"><a class="nav-link" href="{{ url_for('performance') }}">Performance</a></li>
       <li class="nav-item">
        <a class="btn btn-danger ms-2" href="{{ url_for('logout') }}">Logout</a>
      </li>
    </ul>
  </div>
</nav>

<!-- CONTENT -->
<div class="container mt-5">

  <h2>📊 Charts & Insights</h2>

  <div class="row text-center g-4">

    <div class="col-md-4">
      <div class="glass">
        <p>Total Classes</p>
        <div class="metric">6</div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="glass">
        <p>Total Detections</p>
        <div class="metric">1542</div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="glass">
        <p>Most Common</p>
        <div class="metric">Pothole</div>
      </div>
    </div>

  </div>

  <div class="glass chart-box">
    <h4 style="color:#facc15;">📊 Damage Distribution</h4>
    <div id="pieChart"></div>
  </div>

  <div class="glass chart-box">
    <h4 style="color:#facc15;">📊 Precision per Class</h4>
    <div id="barChart"></div>
  </div>

</div>

<script>

/* ================= TOPOGRAPHY BACKGROUND ================= */
const canvas = document.getElementById("topoCanvas");
const ctx = canvas.getContext("2d");

let w = canvas.width = window.innerWidth;
let h = canvas.height = window.innerHeight;

window.addEventListener("resize", () => {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
});

let t = 0;

function getHeight(x, i){
  return Math.sin(x*0.002 + t + i)*30 +
         Math.sin(x*0.003 + t*0.7)*20;
}

function animate(){
  t += 0.01;

  ctx.fillStyle = "#020617"; /* THEME COLOR */
  ctx.fillRect(0,0,w,h);

  ctx.strokeStyle = "rgba(250,204,21,0.15)"; /* YELLOW LINES */
  ctx.lineWidth = 1;

  let lines = 20;
  let spacing = h / lines;

  for(let i=0;i<lines;i++){
    ctx.beginPath();
    for(let x=0;x<w;x+=5){
      let y = spacing*i + getHeight(x,i);
      if(x===0) ctx.moveTo(x,y);
      else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }

  requestAnimationFrame(animate);
}

animate();

/* ================= PIE ================= */
Plotly.newPlot("pieChart", [{
  labels:["Pothole","Transverse Crack","Longitudinal Crack","Edge Crack","Alligator Crack","Joint Crack"],
  values:[450,220,180,160,320,212],
  type:"pie",
  hole:0.4,
  marker:{
    colors:["#ff9800","#03a9f4","#673ab7","#4caf50","#f44336","#9e9e9e"]
  }
}], {
  paper_bgcolor:"rgba(0,0,0,0)",
  font:{color:"white"}
});

/* ================= BAR ANIMATION ================= */
const finalValues = [0.904,0.808,0.800,0.940,0.868,0.856];
let current = [0,0,0,0,0,0];

function animateBars(){
  let done = true;

  for(let i=0;i<current.length;i++){
    if(current[i] < finalValues[i]){
      current[i] += 0.02;
      done = false;
    }
  }

  Plotly.newPlot("barChart", [{
    x:["Pothole","Transverse Crack","Longitudinal Crack","Edge Crack","Alligator Crack","Joint Crack"],
    y:current,
    type:"bar",
    marker:{
      color:["#ff9800","#03a9f4","#673ab7","#4caf50","#f44336","#9e9e9e"]
    }
  }], {
    paper_bgcolor:"rgba(0,0,0,0)",
    font:{color:"white"},
    yaxis:{range:[0,1]}
  });

  if(!done) requestAnimationFrame(animateBars);
}

animateBars();

</script>

</body>
</html>
